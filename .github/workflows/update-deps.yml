name: Update dependencies

on:
  workflow_dispatch:
    inputs:
      target:
        description: "How far to bump"
        type: choice
        options:
          - latest   # everything, including majors
          - minor    # minor/patch only
        default: latest
  schedule:
    - cron: "0 6 * * 1"   # weekly runs use minor (see TARGET below)

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      TARGET: ${{ github.event.inputs.target || 'minor' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update dependencies
        run: |
          npx --yes npm-check-updates -u --target "$TARGET"
          # --ignore-scripts so postinstall (prisma generate) waits for the Prisma 7 setup
          npm install --ignore-scripts
          npm install --ignore-scripts dotenv pg @prisma/adapter-pg
          # deprecated stub, bcryptjs 3 ships its own types
          npm uninstall --ignore-scripts @types/bcryptjs || true

      - name: Prisma 7 setup
        run: |
          sed -i '/^datasource/,/^}/{/^\s*\(url\|directUrl\|shadowDatabaseUrl\)\s*=/d}' prisma/schema.prisma

          if [ ! -f prisma.config.ts ]; then
            cat > prisma.config.ts <<'EOF'
          import "dotenv/config";
          import { defineConfig, env } from "prisma/config";

          export default defineConfig({
            schema: "prisma/schema.prisma",
            migrations: {
              path: "prisma/migrations",
            },
            datasource: {
              url: env("DATABASE_URL"),
            },
          });
          EOF
          fi

          npx prisma generate

      - name: Verify (does not block the PR)
        id: verify
        continue-on-error: true
        run: |
          npx tsc --noEmit
          npm run build

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-deps
          commit-message: "chore: update dependencies (${{ env.TARGET }}) and migrate to Prisma 7"
          title: "chore: update dependencies (${{ env.TARGET }}) and migrate to Prisma 7"
          body: |
            - Dependency bump target: **${{ env.TARGET }}**
            - Added `prisma.config.ts`, removed `url` from the `schema.prisma` datasource
            - Added `pg` and `@prisma/adapter-pg` (required by Prisma 7)

            Typecheck/build result: **${{ steps.verify.outcome }}**
